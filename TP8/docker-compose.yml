version: '3.8'  # (optionnel, mais clair)

services:
  service-a:
    build: ./service-a
    container_name: service-a
    networks:
      - kong-net

  service-b:
    build: ./service-b
    container_name: service-b
    networks:
      - kong-net

  kong:
    image: kong:latest
    container_name: kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./kong.yml:/etc/kong/kong.yml:ro
    ports:
      - "8000:8000"  # Proxy port
      - "8001:8001"  # Admin API
    networks:
      - kong-net

networks:
  kong-net:
    driver: bridge
